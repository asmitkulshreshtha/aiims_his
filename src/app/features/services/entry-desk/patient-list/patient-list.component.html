<app-header></app-header>

<!-- ✅ Patient Table -->
<div class="table-wrapper">
  <table mat-table [dataSource]="patients" class="mat-elevation-z8">

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.name }} </td>
    </ng-container>

    <!-- CR Number -->
    <ng-container matColumnDef="crNumber">
      <th mat-header-cell *matHeaderCellDef> CR Number </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.cr_number }} </td>
    </ng-container>

    <!-- Gender -->
    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef> Gender </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.gender }} </td>
    </ng-container>

    <!-- Age -->
    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef> Age </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.age }} </td>
    </ng-container>

    <!-- Category -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Category </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.category }} </td>
    </ng-container>

    <!-- Department -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef> Department </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.department }} </td>
    </ng-container>

    <!-- Room -->
    <ng-container matColumnDef="room">
      <th mat-header-cell *matHeaderCellDef> Room </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.room }} </td>
    </ng-container>

    <!-- Visit Date -->
    <ng-container matColumnDef="visitDate">
      <th mat-header-cell *matHeaderCellDef> Visit Date </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.visitDate }} </td>
    </ng-container>

    <!-- Visit Time -->
    <ng-container matColumnDef="visitTime">
      <th mat-header-cell *matHeaderCellDef> Visit Time </th>
      <td mat-cell *matCellDef="let patient"> {{ patient.visitTime }} </td>
    </ng-container>

    <!-- Header and Row Definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let patient; columns: displayedColumns;" (click)="viewDetails(patient)"></tr>
  </table>
</div>
