<app-header></app-header>
<form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="patient-form">
    <h2>Patient Registration</h2>
    <div class="form-grid">
        <mat-form-field appearance="outline">
            <mat-label>Patient Name</mat-label>
            <input matInput formControlName="patientName" />
            <mat-error *ngIf="patientForm.get('patientName')?.hasError('required')">Patient Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>CR Number</mat-label>
            <input matInput formControlName="crNumber" />
            <mat-error *ngIf="patientForm.get('crNumber')?.hasError('required')">CR Number is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Gender</mat-label>
            <mat-select formControlName="gender">
                <mat-option value="Male">Male</mat-option>
                <mat-option value="Female">Female</mat-option>
                <mat-option value="Other">Other</mat-option>
            </mat-select>
            <mat-error *ngIf="patientForm.get('gender')?.hasError('required')">Gender is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Age</mat-label>
            <input matInput formControlName="age" type="number" />
            <mat-error *ngIf="patientForm.get('age')?.hasError('required')">Age is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Category</mat-label>
            <input matInput formControlName="category" />
            <mat-error *ngIf="patientForm.get('category')?.hasError('required')">Category is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Department</mat-label>
            <input matInput formControlName="department" />
            <mat-error *ngIf="patientForm.get('department')?.hasError('required')">Department is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Room</mat-label>
            <input matInput formControlName="room" />
            <mat-error *ngIf="patientForm.get('room')?.hasError('required')">Room is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Visit Date</mat-label>
            <input matInput formControlName="visitDate" type="date" />
            <mat-error *ngIf="patientForm.get('visitDate')?.hasError('required')">Date is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Visit Time</mat-label>
            <input matInput formControlName="visitTime" type="time" />
            <mat-error *ngIf="patientForm.get('visitTime')?.hasError('required')">Time is required</mat-error>
        </mat-form-field>
    </div>

    <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">Submit</button>
</form>
